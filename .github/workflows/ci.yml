name: Drawink CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Quality Gates
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Collaboration Server Dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Lint and Format Check
        run: bun run lint

      - name: Type Check Frontend and Convex
        run: bun run typecheck

      - name: Type Check Collaboration Server
        run: bun run typecheck:collab

      - name: Test
        run: bun run test

      - name: Build Frontend
        run: bun run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          VITE_CONVEX_URL: https://dummy.convex.cloud

      - name: Build Collab Server
        run: bun run build:collab
