name: Drawink Deployment Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Code
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Lint and Format Check
        run: bun run lint

      - name: Type Check Frontend and Convex
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build Frontend
        run: bun run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          VITE_CONVEX_URL: https://dummy.convex.cloud

  deploy-backend:
    name: Deploy Backend (Convex)
    needs: verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Convex Cloud
        run: bun run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
